[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kw-skills"
version = "1.0.0rc2"
description = "KnowledgeWala AI Engineering Skills: validate, package and prepare Agent Skills for multiple AI coding assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KnowledgeWala" }]
dependencies = []   # standard library only, by design

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kw-skills = "kw_skills.cli:main"

[tool.setuptools]
package-dir = { "" = "tooling" }
packages = ["kw_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tooling"]
