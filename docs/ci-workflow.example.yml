name: ci
# Manual only by design (no per-push minutes). The local gate is scripts/check.ps1 / scripts/check.sh.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: PYTHONPATH=tooling python -m kw_skills validate
      - run: PYTHONPATH=tooling python -m kw_skills compatibility
      - run: PYTHONPATH=tooling python -m kw_skills docs --check
